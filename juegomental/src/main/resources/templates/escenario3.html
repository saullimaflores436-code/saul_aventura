<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error</title>

    <!-- Redirección: vuelve al flujo del juego -->
    <script>
        setTimeout(function(){
            window.location.href = "/escenario1";
        }, 2500);
    </script>

    <style>
        body{
            margin:0;
            height:100vh;
            background:black;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial;
        }

        /* Ventana del juego */
        .pantalla{
            position:relative;
            width:800px;
            height:450px;
            border:4px solid #ff4d4d;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 0 20px #ff4d4d;
        }

        /* Fondo */
        .fondo{
            position:absolute;
            width:100%;
            height:100%;
            object-fit:cover;
        }

        /* Caja central */
        .caja{
            position:absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            background:rgba(0,0,0,0.7);
            padding:30px;
            border-radius:15px;
            text-align:center;
            color:white;
            width:70%;
        }

        h1{
            margin:0;
            font-size:22px;
            line-height:1.4;
        }
    </style>

    <!-- Script para mensaje aleatorio -->
    <script>
        const mensajes = [
            "😂 Bueno… al menos lo intentaste. Eso ya es histórico.",
            "🎯 Fallaste el blanco… pero le diste a la pared con confianza.",
            "🧠 Tu cerebro hoy pidió día libre, ¿no?",
            "🚨 ¡Nuevo récord! Pero no del bueno.",
            "🎭 Actuaste como si supieras… y casi te creemos.",
            "😌 Me encanta tu seguridad… aunque esté completamente equivocada.",
            "🤝 Gracias por participar… vuelve cuando el cerebro esté online.",
            "⚠️ Casi… pero no. Mucha fe, poca precisión.",
            "🫠 Eso estuvo tan mal que hasta el fondo se decepcionó.",
            "🔄 Reiniciando neuronas… espera un momento."
        ];

        window.onload = function(){
            const random = Math.floor(Math.random() * mensajes.length);
            document.getElementById("mensajeRandom").innerText = mensajes[random];
        }
    </script>

</head>

<body>

<div class="pantalla">

    <!-- Imagen de fondo -->
    <img src="/img/escenario3.png" class="fondo">

    <!-- Mensaje -->
    <div class="caja">
        <h1 id="mensajeRandom"></h1>
    </div>

</div>

</body>
</html>
