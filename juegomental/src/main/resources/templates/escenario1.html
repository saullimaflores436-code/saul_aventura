<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pregunta</title>

    <style>
        body{
            margin:0;
            height:100vh;
            background:black;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial;
        }

        /* Ventana del juego */
        .pantalla{
            position:relative;
            width:800px;
            height:450px;
            border:4px solid #00ffcc;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 0 20px #00ffcc;
        }

        /* Imagen de fondo */
        .fondo{
            position:absolute;
            width:100%;
            height:100%;
            object-fit:cover;
        }

        /* Caja central */
        .caja{
            position:absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            background:rgba(0,0,0,0.75);
            padding:25px;
            border-radius:15px;
            text-align:center;
            color:white;
            width:70%;
        }

        h1{
            font-size:20px;
            margin-bottom:15px;
        }

        /* Barra de progreso */
        .barra{
            width:100%;
            height:15px;
            background:#222;
            border-radius:10px;
            margin-bottom:10px;
            overflow:hidden;
        }

        .progreso{
            height:100%;
            background:#00ffcc;
            transition:width 0.4s;
        }

        .contador{
            font-size:14px;
            margin-bottom:15px;
            color:#00ffcc;
        }

        button{
            width:100%;
            padding:10px;
            margin:6px 0;
            font-size:15px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            background:#00ffcc;
            transition:0.2s;
        }

        button:hover{
            background:#00cc99;
        }
    </style>
</head>

<body>

<div class="pantalla">

    <!-- Fondo escenario -->
    <img src="/img/escenario1.png" class="fondo">

    <!-- Caja central -->
    <div class="caja">

        <!-- Barra de progreso -->
        <div class="barra">
            <div class="progreso" th:style="'width:' + ${progreso} + '%'"></div>
        </div>

        <!-- Número de pregunta -->
        <div class="contador">
            Pregunta <span th:text="${numero}"></span> de 20
        </div>

        <!-- Pregunta -->
        <h1 th:text="${pregunta}">Texto de pregunta</h1>

        <!-- Opciones -->
        <form action="/responder" method="post">
            <button type="submit" name="opcion" value="0" th:text="${opciones[0]}">Opción 1</button>
            <button type="submit" name="opcion" value="1" th:text="${opciones[1]}">Opción 2</button>
            <button type="submit" name="opcion" value="2" th:text="${opciones[2]}">Opción 3</button>
            <button type="submit" name="opcion" value="3" th:text="${opciones[3]}">Opción 4</button>
        </form>

    </div>
</div>

</body>
</html>
