<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Correcto</title>

    <!-- Redirección automática a la siguiente pregunta -->
    <script>
        setTimeout(function(){
            window.location.href = "/escenario1";
        }, 2000);
    </script>

    <style>
        body{
            margin:0;
            height:100vh;
            background:black;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial;
        }

        /* Ventana del juego */
        .pantalla{
            position:relative;
            width:800px;
            height:450px;
            border:4px solid #00ffcc;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 0 20px #00ffcc;
        }

        /* Fondo */
        .fondo{
            position:absolute;
            width:100%;
            height:100%;
            object-fit:cover;
        }

        /* Caja central */
        .caja{
            position:absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            background:rgba(0,0,0,0.7);
            padding:30px;
            border-radius:15px;
            text-align:center;
            color:white;
            width:70%;
        }

        h1{
            margin:0;
            font-size:22px;
            line-height:1.4;
        }
    </style>

    <!-- Script para mensaje aleatorio -->
    <script>
        const mensajesCorrectos = [
            "🔥 ¡Pero míralo/a! ¿Desde cuándo eres tan crack?",
            "🚀 Subiendo de nivel… ya casi desbloqueas el modo leyenda.",
            "🏆 Denle su trofeo invisible porque se lo ganó.",
            "😎 ¿Estás practicando en secreto o qué?",
            "⚡ Eso estuvo tan bien que hasta el juego se sorprendió.",
            "💯 Cuando quieres, puedes… y cuando puedes, arrasas.",
            "👏 Así sí da gusto competir contigo.",
            "✨ Ese cerebro tuyo hoy sí vino a trabajar.",
            "🎯 Precisión quirúrgica… impecable.",
            "😌 Tranquilo/a, deja algo de talento para los demás."
        ];

        window.onload = function(){
            const random = Math.floor(Math.random() * mensajesCorrectos.length);
            document.getElementById("mensajeCorrecto").innerText = mensajesCorrectos[random];
        }
    </script>

</head>

<body>

<div class="pantalla">

    <!-- Imagen de fondo -->
    <img src="/img/escenario2.png" class="fondo">

    <!-- Mensaje -->
    <div class="caja">
        <h1 id="mensajeCorrecto"></h1>
    </div>

</div>

</body>
</html>
